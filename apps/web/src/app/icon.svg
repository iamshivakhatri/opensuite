<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    OpenSuite mark — gradient matches logo (light → deep).
    Solid CTAs use --primary #4d71de / --primary-hover #2d50d1 in globals.css.
  -->
  <defs>
    <linearGradient id="os-mark" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6e8fea"/>
      <stop offset="1" stop-color="#2d50d1"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#os-mark)"/>
  <rect x="11" y="11" width="10" height="10" rx="2.75" fill="#ffffff" fill-opacity="0.95"/>
</svg>
