packages:
  - "apps/*"
  - "packages/*"
confirmModulesPurge: false
allowBuilds:
  esbuild: true
  # Transitive from Casual Docs / Next — not needed for OpenSuite builds.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
# thread-stream@4.2.0 ships a .claude/settings.local.json that Cursor sandbox blocks.
overrides:
  thread-stream: 4.1.0
minimumReleaseAgeExclude:
  - '@opensuitehq/engine-darwin-arm64@0.1.1'
  - '@opensuitehq/engine-darwin-x64@0.1.1'
  - '@opensuitehq/engine-linux-arm64-gnu@0.1.1'
  - '@opensuitehq/engine-linux-x64-gnu@0.1.1'
  - '@opensuitehq/engine-win32-x64-msvc@0.1.1'
  - '@opensuitehq/engine@0.1.1'
