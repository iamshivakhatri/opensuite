# Compose for Dokploy / home-server API stack.
# Context: repository root. Frontend stays on Vercel (apps/web).
#
# Required secrets (set in Dokploy env UI — do not commit real values):
#   BETTER_AUTH_SECRET, RESEND_API_KEY, EMAIL_FROM,
#   WEB_ORIGIN (https://your-vercel-app.vercel.app),
#   BETTER_AUTH_URL (https://api.your-domain.tld),
#   OPENROUTER_API_KEY / OPENROUTER_MODEL (if using managed AI),
#   AI_CREDENTIAL_ENCRYPTION_KEY (for BYOK),
#   ENGINE_GIT_URL (opensuite-engine git URL for native DOCX)
#
# First account: temporarily set ALLOW_SIGNUP=true, create your user, then false.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensuite}
      POSTGRES_DB: opensuite
    volumes:
      - opensuite_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensuite -d opensuite"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-opensuite}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-opensuitesecret}
    volumes:
      - opensuite_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY_ID:-opensuite}\" \"$${S3_SECRET_ACCESS_KEY:-opensuitesecret}\"; do sleep 1; done &&
      mc mb --ignore-existing local/$${S3_BUCKET:-opensuite}
      "
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-opensuite}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-opensuitesecret}
      S3_BUCKET: ${S3_BUCKET:-opensuite}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENGINE_GIT_URL: ${ENGINE_GIT_URL:-}
        ENGINE_GIT_REF: ${ENGINE_GIT_REF:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${API_PUBLISH_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://opensuite:${POSTGRES_PASSWORD:-opensuite}@postgres:5432/opensuite
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      # Closed by default for hosted deploy — flip to true only to create your first user.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # Required when web is on Vercel (different site) and API is HTTPS.
      AUTH_CROSS_ORIGIN: ${AUTH_CROSS_ORIGIN:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-OpenSuite <onboarding@resend.dev>}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-opensuite}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-opensuitesecret}
      S3_BUCKET: ${S3_BUCKET:-opensuite}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-unconfigured}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      MANAGED_AI_TRIAL_CREDIT_MICROS: ${MANAGED_AI_TRIAL_CREDIT_MICROS:-500000}
      MANAGED_AI_TRIAL_DISPLAY_CREDITS: ${MANAGED_AI_TRIAL_DISPLAY_CREDITS:-100}

volumes:
  opensuite_pg:
  opensuite_minio:
