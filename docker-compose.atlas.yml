# Atlas (home server) — API only.
# Uses your existing Postgres + MinIO via the same .env as local/dev.
# Cloudflare Tunnel should route api.opensuite.tech to this container port.
#
# Container listens on 3000; keep it private behind the tunnel.
# Engine: @opensuitehq/engine@0.1.1 from npm (bookworm/glibc image).
#
# First user: ALLOW_SIGNUP=true (+ web NEXT_PUBLIC_ALLOW_SIGNUP=true), then lock.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # www.opensuite.tech and api.opensuite.tech are same-site.
      AUTH_CROSS_ORIGIN: ${AUTH_CROSS_ORIGIN:-false}
